name: raabta
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  scam_shield_core:
    path: packages/scam_shield_core

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_riverpod: ^2.6.1
  fl_chart: ^0.70.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  app_links: ^6.4.0
  flutter_markdown: ^0.7.7+1
  google_maps_flutter: ^2.10.0
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  intl: ^0.20.2
  firebase_auth: ^5.7.0
  firebase_app_check: ^0.3.2+10
  firebase_messaging: ^15.2.10
  go_router: ^17.3.0
  package_info_plus: ^8.3.0

  # Document Scanner (Camera + Auto edge detection + warp)
  cunning_document_scanner: ^1.0.4

  # OCR — reads Arabic + English offline
  google_mlkit_text_recognition: ^0.15.1

  # Image manipulation (contrast filters, watermark rendering)
  image: ^4.1.0

  # Barcode / QR scanner
  mobile_scanner: ^7.2.0

  # PDF generation
  pdf: ^3.10.8

  # Local storage path (save scanned files)
  path_provider: ^2.1.2

  # Text-to-speech (Arabic voice for Landmark Translator)
  flutter_tts: ^4.0.2

  screenshot: ^3.0.0
  image_gallery_saver_plus: ^3.0.1
  permission_handler: ^11.3.1
  crypto: ^3.0.6
  speech_to_text: ^6.6.0
  avatar_glow: ^2.0.2
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  adhan: ^2.0.0+1
  flutter_compass: ^0.8.1
  geolocator: ^14.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  in_app_review: ^2.0.10
  google_fonts: ^8.2.0
  pedometer: ^4.0.2
  share_handler: ^0.0.25
  connectivity_plus: ^7.3.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^3.1.0
  flutter_local_notifications_platform_interface: ^8.0.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/home_materiality_assets/home_grain_light_soft.png
    - assets/home_materiality_assets/home_grain_light.png
    - assets/home_materiality_assets/home_grain_dark.png
    - assets/images/doha/layer_dhow.png
    - assets/images/doha/layer_front.png
    - assets/images/doha/layer_windows.png
    - assets/images/doha/layer_mid.png
    - assets/images/doha/layer_back.png
    - assets/fonts/NotoSansArabic.ttf
    - assets/documents/bill_provider_templates.json
    - assets/official_directory.json
    - assets/scam_shield/forewarning_moments.json
    - assets/scam_shield/scam_checkup_items.json
    - assets/scam_shield/link_shorteners.json
    - assets/scam_shield/scam_types.json
    - assets/scam_shield/security_guidance.json
    - assets/scam_shield/pattern_packs/recovery_offer.json
    - assets/scam_shield/pattern_packs/pay_to_earn_tasks.json
    - assets/scam_shield/pattern_packs/fake_fine_toll.json
    - assets/scam_shield/pattern_packs/one_ring_callback.json
    - assets/scam_shield/qatar_numbering.json
    - assets/scam_shield/calling_codes.json
    - assets/scam_shield/operator_reporting.json
    - assets/scam_shield/check_number_guidance.json
    - assets/scam_shield/report_pack_channels.json
    - assets/civic_report/civic_channels.json
    - assets/scam_shield/pattern_packs/investment_offer.json
    - assets/scam_shield/regulator_registers.json
    - assets/scam_shield/outdated_names.json
    - lib/features/quick_actions/barcode_scanner/data/e_numbers.json

  fonts:
  #    Plus Jakarta Sans — Latin UI (English, Filipino). OFL: home_materiality_assets/OFL.txt
    - family: PlusJakartaSans
      fonts:
        - asset: assets/home_materiality_assets/PlusJakartaSans-VariableFont_wght.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
